# ==============================================
# Nginx Configuration for sinotrukteam.com
# Place at: /etc/nginx/sites-available/sinotrukteam
# Then: ln -s /etc/nginx/sites-available/sinotrukteam /etc/nginx/sites-enabled/
# Finally: nginx -t && systemctl reload nginx
# ==============================================

server {
    listen 80;
    server_name sinotrukteam.com www.sinotrukteam.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sinotrukteam.com www.sinotrukteam.com;

    root /var/www/sinotrukteam;
    index index.html;

    # SSL certificates (use Certbot: certbot --nginx -d sinotrukteam.com -d www.sinotrukteam.com)
    ssl_certificate     /etc/letsencrypt/live/sinotrukteam.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sinotrukteam.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Static assets caching
    location /images/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PHP handler for contact form API
    location /api/contact.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Rate limiting
        limit_req zone=contact burst=5 nodelay;
    }

    # Main location - serve static files
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Logs
    access_log /var/log/nginx/sinotrukteam-access.log;
    error_log  /var/log/nginx/sinotrukteam-error.log;
}

# Rate limiting zone for contact form
limit_req_zone $binary_remote_addr zone=contact:10m rate=5r/m;